name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      # smoke test the installed command
      - run: npm pack
      - run: npm install --global ./csv2md-*.tgz
      - run: csv2md --pretty test/fixtures/example1.csv
      - run: csv2md --pretty < test/fixtures/example1.csv
